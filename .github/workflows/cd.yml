name: CD

on:
  release:
    # a full release, or a pre-release promoted to one. `published` would skip the promotion
    types: [released]

env:
  CARGO_TERM_COLOR: always

# the publish step's verify build runs dependencies' build scripts, which can read whatever the job holds
permissions:
  contents: read

jobs:
  publish:
    # `released` never fires for a pre-release, but a pre-release of v0.1.0 would publish 0.1.0 for good
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    # id-token lets crates-io-auth-action trade a GitHub OIDC token for a crates.io token that lasts
    # 30 minutes and is revoked when the job ends. The verify build's build scripts could get one the
    # same way, but none outlives 30 minutes, unlike the API token this replaces
    permissions:
      contents: read
      id-token: write
    steps:
      # full history, so the guard below can find origin/main
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - run: cargo generate-lockfile

      - uses: Swatinem/rust-cache@v2

      # a version can't be published twice, so a tag like v0.1.0 must match the version in Cargo.toml,
      # and must point at a commit on main, which went through review and CI
      - name: Check the tag
        run: |
          version="$(cargo pkgid | cut -d@ -f2)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi

      # Trusted Publishing: crates.io trusts this repository's cd.yml, so no stored token is needed
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish cargo package
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
