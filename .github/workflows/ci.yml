name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - run: cargo generate-lockfile

      - uses: Swatinem/rust-cache@v2

      # vcpkg builds OpenSSL from source, so cache its binary archives per runner image, which pins the compiler and ports
      - name: Get vcpkg cache key on Windows
        run: echo "VCPKG_CACHE_KEY=vcpkg-openssl-$env:ImageOS-$env:ImageVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
        if: matrix.os == 'windows-latest'

      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ env.VCPKG_CACHE_KEY }}
        if: matrix.os == 'windows-latest'

      - name: Install OpenSSL on Windows
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          vcpkg install openssl:x64-windows-static-md
        if: matrix.os == 'windows-latest'

      - name: Format
        run: cargo fmt --check

      # new lints on beta and nightly should not break the build.
      # one command per step: on Windows, pwsh fails a step only on its last command
      - name: Lint (pure Rust)
        run: cargo clippy --all-targets -- -D warnings
        if: matrix.toolchain == 'stable'

      - name: Lint (OpenSSL AES)
        run: cargo clippy --all-targets --features aes-openssl -- -D warnings
        if: matrix.toolchain == 'stable'

      - name: Check doc
        run: cargo doc --no-deps --features aes-openssl
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test (pure Rust)
        run: cargo test

      - name: Test (OpenSSL AES)
        run: cargo test --features aes-openssl

      # adds the over 2 GiB test, which needs about 4 GB of memory and is too slow in debug builds
      - name: Test (OpenSSL AES, release)
        run: cargo test --release --features aes-openssl
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'

      - name: Check cargo package
        run: cargo publish --dry-run
        if: matrix.os == 'ubuntu-latest'

  check-msrv:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.87.0 # msrv

      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2

      - run: cargo build
      # no OpenSSL on the Windows runner without the vcpkg steps above
      - run: cargo build --features aes-openssl
        if: matrix.os != 'windows-latest'
