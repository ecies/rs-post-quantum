name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v7

      # runs the wasm tests
      - uses: actions/setup-node@v7
        with:
          node-version: 26
        if: matrix.os == 'ubuntu-latest'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32-unknown-unknown, wasm32-wasip2
          components: rustfmt, clippy

      - run: cargo generate-lockfile

      - uses: Swatinem/rust-cache@v2

      # vcpkg builds OpenSSL from source, so cache its binary archives per runner image, which pins the compiler and ports
      - name: Get vcpkg cache key on Windows
        run: echo "VCPKG_CACHE_KEY=vcpkg-openssl-$env:ImageOS-$env:ImageVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
        if: matrix.os == 'windows-latest'

      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ env.VCPKG_CACHE_KEY }}
        if: matrix.os == 'windows-latest'

      - name: Install OpenSSL on Windows
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          vcpkg install openssl:x64-windows-static-md
        if: matrix.os == 'windows-latest'

      - name: Format
        run: cargo fmt --check

      # new lints on beta and nightly should not break the build.
      # one command per step: on Windows, pwsh fails a step only on its last command
      - name: Lint (pure Rust)
        run: cargo clippy --all-targets -- -D warnings
        if: matrix.toolchain == 'stable'

      - name: Lint (OpenSSL AES)
        run: cargo clippy --all-targets --features aes-openssl -- -D warnings
        if: matrix.toolchain == 'stable'

      # the same on every OS
      - name: Lint (wasm)
        run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'

      - name: Check doc
        run: cargo doc --no-deps --features aes-openssl
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test (pure Rust)
        run: cargo test

      - name: Test (OpenSSL AES)
        run: cargo test --features aes-openssl

      # adds the over 2 GiB test, which needs about 4 GB of memory and is too slow in debug builds
      - name: Test (OpenSSL AES, release)
        run: cargo test --release --features aes-openssl
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'

      # wasm-bindgen-test-runner must match the locked wasm-bindgen exactly
      - name: Get wasm-bindgen version
        run: echo "WASM_BINDGEN_VERSION=$(cargo pkgid wasm-bindgen | cut -d@ -f2)" >> "$GITHUB_ENV"
        if: matrix.os == 'ubuntu-latest'

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
        if: matrix.os == 'ubuntu-latest'

      # the same on every OS, so only on Ubuntu, on every toolchain
      - name: Test (wasm)
        run: sh ./scripts/test-wasm.sh
        if: matrix.os == 'ubuntu-latest'

      - uses: taiki-e/install-action@cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'

      # one report for both AES backends, since each compiles out the other's code
      - name: Coverage
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report
          cargo llvm-cov --no-report --features aes-openssl
          cargo llvm-cov report --lcov --output-path .lcov.info
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'

      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        with:
          files: .lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check cargo package
        run: cargo publish --dry-run
        if: matrix.os == 'ubuntu-latest'

  check-msrv:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0 # msrv

      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2

      - run: cargo build
      # no OpenSSL on the Windows runner without the vcpkg steps above
      - run: cargo build --features aes-openssl
        if: matrix.os != 'windows-latest'

  # payloads between this crate and @ecies/post-quantum in both directions, through libcrux's AVX2 and NEON code
  interop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash # with pipefail, so a failure before `tee` fails the step
    steps:
      - uses: actions/checkout@v7

      # libcrux picks its AVX2 code at runtime, and would quietly fall back to its portable code without it
      - name: Check for AVX2
        run: grep -qw avx2 /proc/cpuinfo
        if: matrix.os == 'ubuntu-latest'

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tests/js/package-lock.json

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2

      - name: Install @ecies/post-quantum
        run: npm ci --ignore-scripts
        working-directory: tests/js

      - name: Rust to JS
        run: |
          cargo run --example rust_payloads | tee rust_payloads.txt
          node tests/js/payloads.mjs decrypt rust_payloads.txt
          cargo run --example rust_payloads --features aes-openssl | tee rust_payloads.txt
          node tests/js/payloads.mjs decrypt rust_payloads.txt

      # replaces the committed payloads with fresh ones, printed so that a failure can be reproduced
      - name: JS to Rust (fresh payloads)
        run: |
          node tests/js/payloads.mjs encrypt | tee tests/js_payloads.txt
          cargo test --test js_payloads
          cargo test --test js_payloads --features aes-openssl

  # verifies that key derivation, encryption and decryption leave no secrets or unwiped frames on the stack
  stack-probe:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # libcrux picks its AVX2 code at runtime, and would quietly fall back to its portable code without it
      - name: Check for AVX2
        run: grep -qw avx2 /proc/cpuinfo
        if: matrix.os == 'ubuntu-latest'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - run: cargo generate-lockfile
        working-directory: tests/stack-probe

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/stack-probe

      - name: Format
        run: cargo fmt --check
        working-directory: tests/stack-probe

      - name: Lint
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features aes-openssl -- -D warnings
        working-directory: tests/stack-probe

      - name: Probe (release, pure Rust)
        run: cargo run --release
        working-directory: tests/stack-probe

      - name: Probe (release, OpenSSL AES)
        run: cargo run --release --features aes-openssl
        working-directory: tests/stack-probe

      - name: Probe (opt-level = "s")
        run: cargo run --profile release-s
        working-directory: tests/stack-probe

      - name: Probe (LTO)
        run: cargo run --profile release-lto
        working-directory: tests/stack-probe

      - name: Probe (portable libcrux)
        run: LIBCRUX_DISABLE_SIMD128=1 LIBCRUX_DISABLE_SIMD256=1 cargo run --release --target-dir target/portable
        working-directory: tests/stack-probe

      # debug builds reach deeper than the wipe, so this only prints how deep each call goes (the README's debug figure)
      - name: Probe (debug, measure only)
        run: cargo run -- --measure
        working-directory: tests/stack-probe
