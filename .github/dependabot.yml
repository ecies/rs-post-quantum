version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  # the @ecies/post-quantum that the interop job tests against
  - package-ecosystem: npm
    directory: "/tests/js"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
