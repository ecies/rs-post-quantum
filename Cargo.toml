[package]
name = "ecies-post-quantum"
version = "0.1.0"
# docs
authors = ["Weiliang Li <to.be.impressive@gmail.com>"]
description = "Post-quantum Cryptography Integrated Encryption Scheme in Rust"
edition = "2024"
rust-version = "1.94" # libcrux-platform (pinned by libcrux-ml-kem) calls `__cpuid` as a safe function on x86
keywords = [ # at most five
  "post-quantum",
  "ml-kem",
  "ecies",
  "encryption",
  "cryptography",
]
categories = ["cryptography", "no-std", "wasm"]
license = "MIT"
readme = "README.md"
# links
documentation = "https://docs.rs/ecies-post-quantum/latest/ecies_post_quantum/"
repository = "https://github.com/ecies/rs-post-quantum"

[dependencies]
# ml-kem. 0.0.x, so pinned exactly: each release can break
libcrux-ml-kem = { version = "=0.0.12", default-features = false, features = ["mlkem512", "mlkem768", "mlkem1024"] }

# symmetric ciphers. zeroize wipes their key state on drop
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
# aes (openssl)
openssl = { version = "0.10.81", default-features = false, optional = true } # msrv 1.80

# random number generator. on wasm32-unknown-unknown, the application picks the backend (see README)
getrandom = { version = "0.4.3", default-features = false }

# secret key handling
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.9.2", default-features = false, features = ["alloc"] }

[features]
default = []
# OpenSSL AES-256-GCM instead of the pure Rust one. XChaCha20-Poly1305 stays pure Rust
aes-openssl = ["dep:openssl"]

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
sha3 = { version = "0.12.0", default-features = false }

# the tests run in node, so they enable getrandom's js backend, which the lib leaves to the application (see README)
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"] }
wasm-bindgen-test = "0.3.80"

[[bench]]
harness = false
name = "simple"
path = "bench/simple.rs"
